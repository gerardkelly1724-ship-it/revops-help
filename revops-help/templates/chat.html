<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RevOps Help</title>
  {% include "base_style.html" %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    .wrap { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px 0;
             border-bottom: 1px solid var(--line); }
    header h1 { font-size: 17px; margin: 0; }
    header nav { display: flex; gap: 16px; font-size: 14px; }
    header button, header a { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; text-decoration: none; }
    #log { flex: 1; padding: 20px 0; display: flex; flex-direction: column; gap: 16px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
    .user { background: var(--you); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
    .bot { background: var(--panel); border: 1px solid var(--line); }
    .bot > :first-child { margin-top: 0; } .bot > :last-child { margin-bottom: 0; }
    .bot blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 6px 6px 0; }
    .bot table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
    .bot th, .bot td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    details { margin-top: 10px; font-size: 13px; color: var(--muted); }
    details code { font-size: 12px; }
    .thinking { color: var(--muted); font-style: italic; }
    .empty { color: var(--muted); padding-top: 40px; }
    .empty p { margin: 0 0 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px;
            font-size: 13px; cursor: pointer; text-align: left; }
    form { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 20px; display: flex; gap: 8px; }
    textarea { flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
               background: var(--panel); min-height: 46px; max-height: 160px; }
    form button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
                  color: var(--accent-ink); font-weight: 600; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RevOps Help</h1>
    <nav><button id="new">New chat</button><a href="/logout">Sign out</a></nav>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <p>Ask about a process, a definition, or a specific record. Try one of these:</p>
      <div class="chips">
        <button class="chip">I'm Aoife. Why didn't the Keele demo request come to me?</button>
        <button class="chip">Rhian at Cardiff Met is still a Lead. Is that right?</button>
        <button class="chip">There are two company records for Hull. Merge them please.</button>
        <button class="chip">What's the difference between MQL and SQL?</button>
      </div>
    </div>
  </div>

  <form id="ask">
    <textarea id="q" placeholder="Ask a question" rows="1" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  // The conversation lives in the browser. Each question sends the whole
  // conversation to the server, because Claude itself doesn't remember anything
  // between requests.
  let history = [];
  const log = document.getElementById("log");
  const q = document.getElementById("q");
  const send = document.getElementById("send");

  function render(md) {
    // If the formatting libraries didn't load, show plain text rather than nothing
    if (!window.marked || !window.DOMPurify) {
      const pre = document.createElement("div");
      pre.style.whiteSpace = "pre-wrap";
      pre.textContent = md;
      return pre.outerHTML;
    }
    const html = DOMPurify.sanitize(marked.parse(md));
    const div = document.createElement("div");
    div.innerHTML = html;
    div.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    return div.innerHTML;
  }

  function add(role, content, toolsUsed) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "bot");
    if (role === "user") el.textContent = content;
    else el.innerHTML = content;
    if (toolsUsed && toolsUsed.length) {
      const d = document.createElement("details");
      d.innerHTML = "<summary>Looked up " + toolsUsed.length + " thing" + (toolsUsed.length > 1 ? "s" : "") + " in HubSpot</summary>";
      toolsUsed.forEach(t => {
        const line = document.createElement("div");
        line.innerHTML = "<code></code>";
        line.querySelector("code").textContent = t.tool + " " + JSON.stringify(t.input);
        d.appendChild(line);
      });
      el.appendChild(d);
    }
    log.appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    return el;
  }

  async function ask(text) {
    history.push({ role: "user", content: text });
    add("user", text);
    const waiting = add("bot", '<span class="thinking">Checking…</span>');
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (res.status === 401) { location.href = "/login"; return; }
      const data = await res.json();
      waiting.remove();
      if (data.error) { add("bot", "<em>" + data.error + "</em>"); history.pop(); return; }
      history.push({ role: "assistant", content: data.reply });
      add("bot", render(data.reply), data.tools_used);
    } catch (e) {
      waiting.remove();
      add("bot", "<em>Couldn't reach the server. If the site has been idle it may be waking up, so try again in a minute.</em>");
      history.pop();
    } finally {
      send.disabled = false;
      q.focus();
    }
  }

  document.getElementById("ask").addEventListener("submit", e => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text || send.disabled) return;
    q.value = "";
    ask(text);
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("ask").requestSubmit(); }
  });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.textContent)));
  document.getElementById("new").addEventListener("click", () => location.reload());
</script>
</body>
</html>

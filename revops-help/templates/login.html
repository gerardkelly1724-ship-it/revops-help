<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RevOps Help</title>
  {% include "base_style.html" %}
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--bg); margin-bottom: 12px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent);
             color: var(--accent-ink); font-weight: 600; cursor: pointer; }
    .error { color: #b3412f; font-size: 14px; margin: 0 0 12px; }
  </style>
</head>
<body>
<main>
  <form method="post">
    <h1>RevOps Help</h1>
    <p>Ask about HubSpot processes or a specific record.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>

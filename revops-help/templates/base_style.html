<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65;
    --line: #e4e2db; --accent: #2f5d50; --accent-ink: #ffffff; --you: #e9efe9;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a998f;
      --line: #33322d; --accent: #7fb3a2; --accent-ink: #10201b; --you: #24302b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
</style>
